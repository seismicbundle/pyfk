[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=1.23,<2.5", "scipy>=1.10", "Cython>=3.0,<3.4"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "pyfk"
version = "0.3.1"
description = "Pyfk is the python version of FK used to calculate the Green's function and the synthetic waveforms for the 1D Earth model."
readme = "README.rst"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ziyi Xi", email = "xiziyi2015@gmail.com"}]
dependencies = ["numpy>=1.23,<2.5", "scipy>=1.10", "obspy>=1.4"]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
test = ["pytest>=7.4", "pytest-mpi>=0.6"]

[project.urls]
Upstream = "https://github.com/ziyixi/pyfk"

[tool.pytest.ini_options]
testpaths = ["pyfk/tests"]

[tool.setuptools.package-data]
pyfk = ["**/*.pyx", "**/*.pxd", "tests/data/**/*"]
