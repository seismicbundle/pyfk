[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=1.23,<2.5", "scipy>=1.10", "Cython>=3.0,<3.4"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "pyfk"
version = "0.3.1+seismicbundle.1"
description = "PyFK with OpenMP and GPU optimizations and an optional frequency ceiling"
readme = "README.rst"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ziyi Xi", email = "xiziyi2015@gmail.com"}]
maintainers = [{name = "SeismicBundle"}]
dependencies = ["numpy>=1.23,<2.5", "scipy>=1.10", "obspy>=1.4"]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
cuda = ["numba==0.67.0", "numba-cuda[cu12]==0.30.4", "cupy-cuda12x==14.2.0"]
test = ["pytest>=7.4", "pytest-mpi>=0.6"]

[project.urls]
Repository = "https://github.com/seismicbundle/pyfk"
Upstream = "https://github.com/ziyixi/pyfk"

[tool.pytest.ini_options]
testpaths = ["pyfk/tests", "tests"]
markers = ["cuda: requires an explicitly requested CUDA validation run"]

[tool.setuptools.package-data]
pyfk = ["**/*.pyx", "**/*.pxd", "tests/data/**/*"]
