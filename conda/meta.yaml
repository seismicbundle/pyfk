package:
  name: pyfk
  version: "0.3.1+seismicbundle.1"

source:
  path: ..

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python {{ python }}
    - pip
    - setuptools >=77
    - wheel
    - numpy >=1.23,<2.5
    - scipy >=1.10
    - obspy >=1.4
    - cython >=3.0,<3.4
    - llvm-openmp  # [osx]
  run:
    - python {{ python }}
    - numpy >=1.23,<2.5
    - scipy >=1.10
    - obspy >=1.4
    - llvm-openmp  # [osx]
test:
  source_files:
    - tests
    - validation
    - pyproject.toml
  requires:
    - pytest
    - pytest-mpi
  imports:
    - pyfk
  commands:
    - python -m pytest --pyargs pyfk -q
    - python -m pytest tests --import-mode=importlib -q

about:
  home: https://github.com/seismicbundle/pyfk
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: PyFK with OpenMP and GPU optimizations and an optional frequency ceiling (based on ziyixi/pyfk).
